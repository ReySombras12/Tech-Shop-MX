<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Shop MX - Catálogo de Dispositivos</title>
    <link rel="stylesheet" href="CSS/estilos.css">
    <link rel="stylesheet" href="CSS/catalogo.css">
</head>
<body>
    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="catalogo-header">
        <a href="Pagina_Principal.html" class="back-home">← Volver al inicio</a>
        <div class="nav-buttons">
            <a href="iniciosesion.html" class="btn btn-nav">Iniciar Sesión</a>
            <a href="registro.html" class="btn btn-nav">Registrarse</a>
        </div>
    </header>

    <!-- TÍTULO DE LA PÁGINA -->
    <section class="catalogo-hero">
        <h1 class="catalogo-title">Nuestro Catálogo</h1>
        <p class="catalogo-subtitle">Dispositivos reacondicionados con garantía. Tecnología que cuida tu bolsillo y el planeta.</p>
    </section>

    <!-- BARRA DE FILTROS -->
    <section class="filtros-section">
        <div class="filtros-container">
            <div class="filtro-grupo">
                <label for="filtro-categoria">Categoría</label>
                <select id="filtro-categoria" class="filtro-select">
                    <option value="todos">Todos los dispositivos</option>
                    <option value="celulares">Celulares</option>
                    <option value="tablets">Tablets</option>
                    <option value="audifonos">Audífonos</option>
                    <option value="laptops">Laptops</option>
                    <option value="computadoras">Computadoras de Escritorio</option>
                </select>
            </div>

            <div class="filtro-grupo">
                <label for="filtro-marca">Marca</label>
                <select id="filtro-marca" class="filtro-select">
                    <option value="todas">Todas las marcas</option>
                    <option value="samsung">Samsung</option>
                    <option value="apple">Apple</option>
                    <option value="dell">Dell</option>
                    <option value="lenovo">Lenovo</option>
                </select>
            </div>

            <div class="filtro-grupo">
                <label for="filtro-precio">Precio Máximo</label>
                <select id="filtro-precio" class="filtro-select">
                    <option value="todos">Sin límite</option>
                    <option value="1000">Hasta $1,000</option>
                    <option value="3000">Hasta $3,000</option>
                    <option value="5000">Hasta $5,000</option>
                    <option value="10000">Hasta $10,000</option>
                    <option value="15000">Hasta $15,000</option>
                </select>
            </div>

            <div class="filtro-grupo">
                <label for="filtro-estado">Estado</label>
                <select id="filtro-estado" class="filtro-select">
                    <option value="todos">Todos los estados</option>
                    <option value="excelente">Excelente</option>
                    <option value="bueno">Bueno</option>
                    <option value="regular">Regular</option>
                </select>
            </div>
        </div>
        <div class="filtros-botones">
            <button id="btn-buscar" class="btn btn-primary">🔍 Buscar Dispositivos</button>
            <button id="btn-limpiar-filtros" class="btn btn-secondary">Limpiar Filtros</button>
        </div>
    </section>

    <!-- CONTADOR DE RESULTADOS -->
    <section class="resultados-info">
        <p id="contador-resultados">Mostrando <span>0</span> dispositivos</p>
    </section>

    <!-- GRID DE PRODUCTOS -->
    <section class="catalogo-grid-section">
        <div id="catalogo-grid" class="catalogo-grid">
            <!-- Los productos se cargarán dinámicamente con JavaScript -->
        </div>
        <div id="sin-resultados" class="sin-resultados" style="display: none;">
            <p>😔 No se encontraron dispositivos con esos filtros.</p>
            <button id="btn-mostrar-todos" class="btn btn-primary">Mostrar todos los dispositivos</button>
        </div>
    </section>

    <!-- MODAL DE DETALLE DEL PRODUCTO -->
    <div id="modal-producto" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-body">
                <div class="modal-imagen">
                    <img id="modal-img" src="" alt="">
                </div>
                <div class="modal-info">
                    <span id="modal-badge" class="product-badge"></span>
                    <h2 id="modal-titulo"></h2>
                    <p id="modal-categoria"></p>
                    <p id="modal-descripcion"></p>
                    <p id="modal-especificaciones"></p>
                    <div class="modal-precio">
                        <span id="modal-precio"></span>
                    </div>
                    <div class="modal-botones">
                        <button id="btn-solicitar-compra" class="btn btn-primary">Solicitar Compra</button>
                        <button id="btn-agregar-favorito" class="btn btn-secondary">❤ Agregar a Favoritos</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 Tech Shop MX - Todos los derechos reservados</p>
    </footer>

    <script src="JS/catalogo.js"></script>
</body>
</html>
